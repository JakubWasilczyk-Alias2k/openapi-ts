openapi: 3.0.3
info:
  title: OpenAPI 3.0.3 request body pagination example
  version: 1
paths:
  /all-of:
    post:
      operationId: postAllOf
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AllOfList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
  /nested:
    post:
      operationId: postNested
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NestedList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
  /nested-deep:
    post:
      operationId: postNestedDeep
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NestedDeepList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
  /nested-nullable:
    post:
      operationId: postNestedNullable
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NestedNullableList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
  /nested-filters:
    post:
      operationId: postNestedFilters
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/FiltersList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    Pagination:
      properties:
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
      type: object
    Filters:
      properties:
        name:
          type: string
          nullable: true
        start:
          type: string
          format: date-time
          nullable: true
      type: object
    AllOfList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - properties:
            filters:
              $ref: '#/components/schemas/Filters'
          type: object
    NestedList:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        page:
          $ref: '#/components/schemas/Pagination'
      type: object
    NestedDeepList:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        page:
          properties:
            extra:
              $ref: '#/components/schemas/Pagination'
          type: object
      type: object
    NestedNullableList:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
        page:
          allOf:
            - $ref: '#/components/schemas/Pagination'
          nullable: true
      type: object
    FiltersList:
      properties:
        filters:
          $ref: '#/components/schemas/Filters'
      type: object
