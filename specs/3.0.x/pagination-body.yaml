openapi: 3.0.3
info:
  title: OpenAPI 3.0.3 request body pagination example
  version: 1
paths:
  /all-of:
    post:
      operationId: postAllOf
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AllOfList'
        required: true
      responses:
        '200':
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    Pagination:
      properties:
        limit:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
      type: object
    Filters:
      properties:
        name:
          type: string
          nullable: true
        start:
          type: string
          format: date-time
          nullable: true
      type: object
    AllOfList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - properties:
            filters:
              $ref: '#/components/schemas/Filters'
          type: object
